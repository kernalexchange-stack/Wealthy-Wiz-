<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WealthyWiz — Loading...</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages / Netlify / Static Hosts
    // Redirects 404 paths back to index.html preserving pathname and search query
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body style="background-color: #011415; color: #c2ece2; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center;">
    <p>Loading WealthyWiz mutual fund data...</p>
  </div>
</body>
</html>
