<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Outer circle gradient -->
    <linearGradient id="wwBackdropGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#1e1456" />
      <stop offset="35%" stop-color="#1a256f" />
      <stop offset="70%" stop-color="#08647a" />
      <stop offset="100%" stop-color="#088ea2" />
    </linearGradient>

    <!-- Owl Body gradient -->
    <linearGradient id="wwBodyGrad" x1="50%" y1="12%" x2="50%" y2="92%">
      <stop offset="0%" stop-color="#8da2fc" />
      <stop offset="28%" stop-color="#7a93f8" />
      <stop offset="65%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Wing Gradients -->
    <linearGradient id="wwLeftWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6f88ec" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="wwRightWingGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6f88ec" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Golden Amber Beak & Feet -->
    <linearGradient id="wwGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Ear Horns Gradient -->
    <linearGradient id="wwEarLeftGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6b86ec" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="wwEarRightGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6b86ec" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- 1. Outer Backdrop Circle (Square-compatible 1:1 favicon) -->
  <circle cx="60" cy="60" r="58" fill="url(#wwBackdropGrad)" />

